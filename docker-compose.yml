services:
  wunschdruck:
    build: .
    container_name: wunschdruck
    restart: unless-stopped
    ports:
      - "8446:8446"
    env_file: .env
    environment:
      - TZ=Europe/Berlin
    volumes:
      - ./slicer/squashfs-root:/opt/orca:ro
      # Vanilla-Orca sliced die Mehrfarb-Projekte (Fork-CLI-Bug, siehe slicer.py)
      - ./slicer/vanilla-root:/opt/vanilla:ro
      - wunschdruck-daten:/data

volumes:
  wunschdruck-daten:
