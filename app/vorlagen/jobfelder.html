{# Job-Einstellungen fuer neue Auftraege (Upload + Thingiverse); braucht t, slots, eigene_profile #}
    <div class="reihe">
      <label>{{ t.slot }}
        <select name="slot">
          {% for s in slots %}
          <option value="{{ loop.index }}" {% if s.material == 'leer' %}disabled{% endif %}>
            {{ loop.index }} — {{ t.leer if s.material == 'leer' else s.material }}{% if s.farbe %} ({{ s.farbe }}){% endif %}
          </option>
          {% endfor %}
        </select>
      </label>
      <label>{{ t.qualitaet }}
        <select name="qualitaet">
          <option value="standard">{{ t.standard }}</option>
          <option value="fein">{{ t.fein }}</option>
          <option value="schnell">{{ t.schnell }}</option>
          {% if eigene_profile %}
          <optgroup label="{{ t.profile_gruppe }}">
            {% for p in eigene_profile %}
            <option value="eigen:{{ p }}">{{ p }}</option>
            {% endfor %}
          </optgroup>
          {% endif %}
        </select>
      </label>
      <label>{{ t.stuetzen }}
        <select name="stuetzen">
          <option value="auto">{{ t.stuetzen_auto }}</option>
          <option value="aus">{{ t.stuetzen_aus }}</option>
        </select>
      </label>
      <label>{{ t.stuetz_filament }}
        <select name="stuetz_slot">
          <option value="0">{{ t.wie_modell }}</option>
          {% for s in slots %}
          <option value="{{ loop.index }}" {% if s.material == 'leer' %}disabled{% endif %}>
            Slot {{ loop.index }} — {{ t.leer if s.material == 'leer' else s.material }}{% if s.farbe %} ({{ s.farbe }}){% endif %}
          </option>
          {% endfor %}
        </select>
      </label>
      <label>{{ t.ausrichtung }}
        <select name="ausrichtung">
          <option value="auto">{{ t.ausrichtung_auto }}</option>
          <option value="datei">{{ t.ausrichtung_datei }}</option>
        </select>
      </label>
      <label>{{ t.fuellung }}
        <input type="number" name="fuellung" min="0" max="100" step="5" placeholder="{{ t.profil_standard }}">
      </label>
      <label>{{ t.stuetz_art }}
        <select name="stuetz_art">
          <option value="profil">{{ t.profil_standard }}</option>
          <option value="baum">{{ t.stuetz_baum }}</option>
          <option value="normal">{{ t.stuetz_normal }}</option>
        </select>
      </label>
      <label>{{ t.waende }}
        <input type="number" name="waende" min="1" max="10" placeholder="{{ t.profil_standard }}">
      </label>
      <label>{{ t.deckschichten }}
        <input type="number" name="deckschichten" min="0" max="15" placeholder="{{ t.profil_standard }}">
      </label>
      <label>{{ t.bodenschichten }}
        <input type="number" name="bodenschichten" min="0" max="15" placeholder="{{ t.profil_standard }}">
      </label>
      <label>{{ t.naht }}
        <select name="naht">
          <option value="">{{ t.profil_standard }}</option>
          <option value="back">{{ t.naht_hinten }}</option>
          <option value="aligned">{{ t.naht_aligned }}</option>
          <option value="nearest">{{ t.naht_nearest }}</option>
          <option value="random">{{ t.naht_random }}</option>
        </select>
      </label>
      <label>{{ t.anzahl }}
        <input type="number" name="anzahl" value="1" min="1" max="25">
      </label>
      <label>{{ t.platte }}
        <input type="number" name="platte" value="1" min="1" max="16">
      </label>
    </div>
