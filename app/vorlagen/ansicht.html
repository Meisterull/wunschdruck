{% extends "basis.html" %}
{% block inhalt %}
<style>
  header { display: none; }  /* Vollbild: Seiten-Chrome weg */
  main { max-width: none; padding: 0; margin: 0; }
  #buehne { position: fixed; inset: 0; z-index: 10; touch-action: none; }
  #buehne canvas { display: block; }
  .schwebe { position: fixed; z-index: 20; left: 0; right: 0; padding: .7rem 1rem;
             background: color-mix(in srgb, #1c1a17 82%, transparent);
             color: #ece8e1; transition: opacity .25s, visibility .25s; }
  .schwebe.oben { top: 0; display: flex; justify-content: space-between; align-items: center; }
  .schwebe.unten { bottom: 0; }
  .schwebe a { color: #e08a4c; text-decoration: none; font-weight: 600; }
  .schwebe .hinweis { color: #a39c90; margin: .3rem 0 0; }
  .versteckt { opacity: 0; visibility: hidden; }
  .schwebe .regler { display: flex; gap: 1rem; align-items: center; }
  .schwebe input[type=range] { width: 100%; background: transparent; }
  .schwebe label { color: #a39c90; }
</style>

<div id="buehne"></div>
<div class="schwebe oben" id="leiste_oben">
  <span>🧊 {{ job.name }}</span>
  <a href="/">← {{ t.zurueck }}</a>
</div>
<div class="schwebe unten" id="leiste_unten">
  <div class="regler">
    <label style="flex:1">{{ t.ebenen }}: <span id="ebene_anzeige">–</span>
      <input type="range" id="ebenen_regler" min="1" max="1" value="1">
    </label>
    <label class="zeile"><input type="checkbox" id="fuellung_schalter"> {{ t.fuellung_zeigen }}</label>
  </div>
  <p class="hinweis" id="legende"></p>
  <p class="hinweis">{{ t.ansicht_tipp }} {{ t.doppeltipp_tipp }}</p>
</div>

<script src="/statisch/three.min.js"></script>
<script src="/statisch/OrbitControls.js"></script>
<script>
// Werkzeugfarben = echte Slot-Farben aus dem Lager, Festpalette als Rückfall.
// (Heller Hintergrund: auch schwarzes Filament ist so direkt sichtbar.)
const RUECKFALL = ['#e08a4c', '#5b8dd9', '#5cb877', '#c95fa0'];
const WERKZEUG_FARBEN = [
  {%- for s in slots %}'{{ s.get("hex") or "" }}',{% endfor -%}
].map((h, i) => h || RUECKFALL[i % 4]);

const buehne = document.getElementById('buehne');
const regler = document.getElementById('ebenen_regler');
const anzeige = document.getElementById('ebene_anzeige');

const szene = new THREE.Scene();
szene.background = new THREE.Color(0xb9b4ac);  // helle, warme Bühne
const kamera = new THREE.PerspectiveCamera(45, 1, 1, 4000);
// WICHTIG: Z ist bei uns oben — und OrbitControls liest die Up-Richtung nur
// EINMAL beim Erzeugen. Wird sie erst später gesetzt, rotiert die Steuerung
// intern um die falsche Achse und schlägt beim Drehen um.
kamera.up.set(0, 0, 1);
const renderer = new THREE.WebGLRenderer({antialias: true});
buehne.appendChild(renderer.domElement);
const steuerung = new THREE.OrbitControls(kamera, renderer.domElement);
steuerung.enableDamping = true;
// Nicht über die Pole kippen (Umschlagen), aber die Platte darf komplett
// von unten betrachtet werden.
steuerung.minPolarAngle = 0.05;
steuerung.maxPolarAngle = Math.PI - 0.05;
steuerung.rotateSpeed = 0.85;

function groesse() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  kamera.aspect = window.innerWidth / window.innerHeight;
  kamera.updateProjectionMatrix();
}
window.addEventListener('resize', groesse);

// Doppeltipp auf die Bühne blendet die Bedienleisten ein/aus.
let letzterTipp = 0;
function leistenUmschalten() {
  document.getElementById('leiste_oben').classList.toggle('versteckt');
  document.getElementById('leiste_unten').classList.toggle('versteckt');
}
renderer.domElement.addEventListener('pointerup', (e) => {
  const jetzt = Date.now();
  if (jetzt - letzterTipp < 320) leistenUmschalten();
  letzterTipp = jetzt;
});

const gruppen = [];  // {linien, offsets[layer] -> Vertexzahl, fuellung}

fetch(location.pathname.replace('/ansicht', '/vorschau'))
  .then(r => r.json())
  .then(daten => {
    const [bx, by] = daten.bett;
    const raster = new THREE.GridHelper(Math.max(bx, by), Math.max(bx, by) / 10,
                                        0x8f8a82, 0xa8a39a);
    raster.rotation.x = Math.PI / 2;
    raster.position.set(bx / 2, by / 2, 0);
    szene.add(raster);
    const umriss = new THREE.LineLoop(
      new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0), new THREE.Vector3(bx, 0, 0),
        new THREE.Vector3(bx, by, 0), new THREE.Vector3(0, by, 0)]),
      new THREE.LineBasicMaterial({color: 0x6e675e}));
    szene.add(umriss);

    // "VORNE"-Marker an der vorderen Plattenkante (U1: Y=0 = Tür-Seite).
    const schild = document.createElement('canvas');
    schild.width = 256; schild.height = 80;
    const sz = schild.getContext('2d');
    sz.fillStyle = '#6e675e';
    sz.font = 'bold 52px system-ui, sans-serif';
    sz.textAlign = 'center'; sz.textBaseline = 'middle';
    sz.fillText('▼ VORNE', 128, 40);
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
      map: new THREE.CanvasTexture(schild), transparent: true }));
    sprite.scale.set(64, 20, 1);
    sprite.position.set(bx / 2, -18, 2);
    szene.add(sprite);

    // Je (Werkzeug, Klasse) EIN LineSegments-Objekt; die Ebenen liegen darin
    // aufsteigend, so schneidet der Regler per drawRange von unten nach oben.
    const sammel = new Map();
    daten.ebenen.forEach(eb => {
      eb.spuren.forEach(sp => {
        const key = sp.t + '|' + sp.k;
        if (!sammel.has(key)) sammel.set(key, {t: sp.t, k: sp.k});
      });
    });
    // Ebenen-Höhen für die Seitenwände der Bänder (aus den Z-Sprüngen).
    const hoehen = daten.ebenen.map((eb, i) =>
      Math.min(0.45, Math.max(0.08, eb.z - (i ? daten.ebenen[i - 1].z : 0))));
    // Teil-Bahnen als UNDURCHSICHTIGE Bänder (Deckband + Seitenwand je Segment)
    // — bei Riesenmodellen Rückfall auf Linien, sonst wird's dem Handy zu viel.
    let teilSegmente = 0;
    daten.ebenen.forEach(eb => eb.spuren.forEach(sp => {
      if (sp.k === 'teil') sp.l.forEach(p => teilSegmente += p.length / 2 - 1);
    }));
    const bandModus = teilSegmente < 320000;
    const HALBBREITE = 0.22;

    sammel.forEach(gr => {
      const offsets = [];
      let objekt;
      if (gr.k === 'teil' && bandModus) {
        const pos = [], col = [];
        const cTop = new THREE.Color(WERKZEUG_FARBEN[gr.t % 4]);
        const cSeite = cTop.clone().multiplyScalar(0.7);
        daten.ebenen.forEach((eb, ei) => {
          const h = hoehen[ei];
          eb.spuren.filter(sp => sp.t === gr.t && sp.k === gr.k).forEach(sp => {
            sp.l.forEach(p => {
              for (let i = 0; i + 3 < p.length; i += 2) {
                const x1 = p[i], y1 = p[i + 1], x2 = p[i + 2], y2 = p[i + 3];
                const L = Math.hypot(x2 - x1, y2 - y1) || 1;
                const nx = -(y2 - y1) / L * HALBBREITE, ny = (x2 - x1) / L * HALBBREITE;
                const z = eb.z, zu = z - h;
                pos.push(x1 + nx, y1 + ny, z,  x1 - nx, y1 - ny, z,  x2 - nx, y2 - ny, z,
                         x1 + nx, y1 + ny, z,  x2 - nx, y2 - ny, z,  x2 + nx, y2 + ny, z);
                for (let k = 0; k < 6; k++) col.push(cTop.r, cTop.g, cTop.b);
                pos.push(x1, y1, zu,  x2, y2, zu,  x2, y2, z,
                         x1, y1, zu,  x2, y2, z,   x1, y1, z);
                for (let k = 0; k < 6; k++) col.push(cSeite.r, cSeite.g, cSeite.b);
              }
            });
          });
          offsets.push(pos.length / 3);
        });
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
        objekt = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
          vertexColors: true, side: THREE.DoubleSide }));
      } else {
        const punkte = [];
        daten.ebenen.forEach(eb => {
          eb.spuren.filter(sp => sp.t === gr.t && sp.k === gr.k).forEach(sp => {
            sp.l.forEach(p => {  // jede Bahn einzeln — keine Phantom-Nähte
              for (let i = 0; i + 3 < p.length; i += 2) {
                punkte.push(p[i], p[i + 1], eb.z, p[i + 2], p[i + 3], eb.z);
              }
            });
          });
          offsets.push(punkte.length / 3);
        });
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(punkte, 3));
        const stuetze = gr.k === 'stuetze', rand = gr.k === 'rand', fuellung = gr.k === 'fuellung';
        objekt = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
          color: stuetze ? '#7a746b' : (rand ? '#8a8378' : WERKZEUG_FARBEN[gr.t % 4]),
          transparent: stuetze || rand || fuellung,
          opacity: stuetze ? 0.6 : (rand ? 0.35 : (fuellung ? 0.4 : 1)),
        }));
      }
      objekt.visible = gr.k !== 'fuellung';  // Innenleben standardmäßig aus
      szene.add(objekt);
      gruppen.push({linien: objekt, offsets, fuellung: gr.k === 'fuellung'});
    });
    document.getElementById('fuellung_schalter').addEventListener('change', (e) => {
      gruppen.forEach(gr => { if (gr.fuellung) gr.linien.visible = e.target.checked; });
    });

    regler.max = daten.ebenen.length;
    regler.value = daten.ebenen.length;
    regler.addEventListener('input', ebenenSchnitt);
    ebenenSchnitt();

    const legende = daten.werkzeuge.map(w =>
      `<span style="color:${WERKZEUG_FARBEN[w % 4]}">■</span> Slot ${w + 1}`);
    legende.push('<span style="color:#8a8378">■</span> {{ t.stuetzen }}');
    document.getElementById('legende').innerHTML = legende.join(' &nbsp; ');

    const dist = Math.max(bx, by, daten.hoehe) * 1.4;
    kamera.position.set(bx / 2 + dist * 0.55, by / 2 - dist * 0.75, dist * 0.7);
    steuerung.target.set(bx / 2, by / 2, daten.hoehe / 3);
    groesse();
  });

function ebenenSchnitt() {
  const k = parseInt(regler.value, 10);
  anzeige.textContent = k + ' / ' + regler.max;
  gruppen.forEach(gr => gr.linien.geometry.setDrawRange(0, (gr.offsets[k - 1] || 0)));
}

(function schleife() {
  requestAnimationFrame(schleife);
  steuerung.update();
  renderer.render(szene, kamera);
})();
</script>
{% endblock %}
