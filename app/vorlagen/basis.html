<!doctype html>
<html lang="{{ sprache }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ t.titel }}</title>
<link rel="stylesheet" href="/statisch/stil.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖨️</text></svg>">
</head>
<body>
<header>
  <a class="marke" href="/">🖨️ {{ t.titel }}</a>
  <nav>
    <a href="/einstellungen">⚙️ {{ t.einstellungen }}</a>
    <a href="/sprache/{{ 'en' if sprache == 'de' else 'de' }}">{{ 'EN' if sprache == 'de' else 'DE' }}</a>
  </nav>
</header>
<main>
{% block inhalt %}{% endblock %}
</main>
</body>
</html>
